name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (lint)
        run: npm run lint

      - name: Build frontend & backend bundle
        run: npm run build

      - name: Verify production bundle boots
        env:
          NODE_ENV: production
        run: node -e "console.log('dist built:', require('node:fs').existsSync('dist/server.cjs')); if(!require('node:fs').existsSync('dist/server.cjs')) process.exit(1);"