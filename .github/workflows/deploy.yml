name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    name: Trigger Render redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          && echo "" && echo "Deploy triggered."

      - name: Skip notice (no hook configured)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping Render deploy (Render auto-deploy may still apply)."